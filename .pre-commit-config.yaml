repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: black
        name: black
        entry: uv run --frozen --extra dev black
        language: system
        types: [python]
        files: ^(src|tests)/

      - id: isort
        name: isort
        entry: uv run --frozen --extra dev isort
        language: system
        types: [python]
        files: ^(src|tests)/

      - id: ruff
        name: ruff
        entry: uv run --frozen --extra dev ruff check
        language: system
        types: [python]
        files: ^(src|tests)/
        args: [--fix, --exit-non-zero-on-fix]

      - id: mypy
        name: mypy
        entry: uv run --frozen --extra dev mypy
        language: system
        files: ^src/
        pass_filenames: false
        args: [src/]

      - id: pytest-check
        name: unit tests
        entry: uv run --frozen --extra dev pytest
        language: system
        pass_filenames: false
        always_run: true
        args: [tests/unit/, -q]
        stages: [pre-push]
