name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.5"
          save-cache: false

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run Ruff
        run: uv run ruff check src/ tests/

      - name: Check formatting with Black
        run: uv run black --check src/ tests/

      - name: Check import ordering
        run: uv run isort --check-only src/ tests/

      - name: Run mypy
        run: uv run mypy src/

  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.5"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run unit tests
        run: >
          uv run pytest tests/unit/ -v
          --cov=src
          --cov-report=xml
          --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

      - name: Generate coverage report
        run: uv run coverage html

      - name: Upload coverage HTML
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: htmlcov/

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      zookeeper:
        image: confluentinc/cp-zookeeper:7.5.0
        ports:
          - 2181:2181
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
          ZOOKEEPER_TICK_TIME: 2000

      kafka:
        image: confluentinc/cp-kafka:7.5.0
        ports:
          - 9092:9092
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.5"
          save-cache: false

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Wait for Kafka metadata
        run: |
          uv run python - <<'PY'
          import time

          from kafka.admin import KafkaAdminClient

          last_error = None

          for attempt in range(1, 31):
              try:
                  admin = KafkaAdminClient(
                      bootstrap_servers="localhost:9092",
                      request_timeout_ms=5000,
                      bootstrap_timeout_ms=5000,
                  )
                  topics = admin.list_topics()
                  admin.close()
                  print(f"Kafka is ready with {len(topics)} topics")
                  break
              except Exception as exc:
                  last_error = exc
                  print(f"Kafka readiness attempt {attempt}/30 failed: {exc}")
                  time.sleep(2)
          else:
              raise SystemExit(f"Kafka did not become ready: {last_error}")
          PY

      - name: Run integration tests
        run: uv run pytest tests/integration/ -v -m integration
        env:
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=moderate

      - name: Build production frontend
        run: npm run build
        env:
          CI: "true"

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.5"
          save-cache: false

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run Bandit
        run: uv run bandit -r src/ -ll

      - name: Audit Python dependencies
        run: |
          audit_args=()

          while IFS= read -r vulnerability_id; do
            case "$vulnerability_id" in
              ""|\#*) continue ;;
            esac

            audit_args+=(--ignore-vuln "$vulnerability_id")
          done < security/pip-audit-allowlist.txt

          uv run pip-audit --local "${audit_args[@]}"

  container-build:
    name: Validate Container Builds
    runs-on: ubuntu-latest
    needs: [lint, test, frontend]

    steps:
      - uses: actions/checkout@v7

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build application images
        run: docker compose build api frontend
